<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chemistry CBT 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .option-btn:hover { background-color: #dbeafe; }
   .option-btn.selected { background-color: #2563eb; color: white; }
   .flagged { background-color: #fbbf24 !important; color: black !important; }
   .attempted { background-color: #10b981 !important; color: white !important; }
   .current { border: 3px solid #2563eb !important; }
   #question-grid button { 
     width: 35px; height: 35px; 
     background: #e5e7eb; 
     border-radius: 6px; 
     font-weight: bold;
     font-size: 12px;
     transition: all 0.2s;
   }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div id="cbt-container" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-2xl font-bold">Sample WAEC-style CBT</h1>
      <div id="timer" class="text-xl font-bold text-red-600">Time: 90:00</div>
    </div>

    <!-- Question Grid + Review Button -->
    <div class="bg-gray-50 p-4 rounded-xl mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-bold text-gray-700">Question Navigation</span>
        <button onclick="flagQuestion()" class="px-4 py-1 bg-yellow-400 hover:bg-yellow-500 rounded-lg font-semibold text-sm flex items-center gap-1">
          Review Later 🔍
        </button>
      </div>
      <div id="question-grid" class="grid grid-cols-10 gap-2">
        <!-- JS will populate buttons here -->
      </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="question-area">
      <div class="flex justify-between items-center mb-2">
        <p class="text-sm text-gray-600">Question <span id="qNum">1</span> of <span id="qTotal">10</span></p>
      </div>
      <h2 id="questionText" class="text-xl font-semibold mb-6 min-h-[60px]"></h2>
      
      <div id="options" class="grid gap-3 mb-8"></div>

      <div class="flex justify-between border-t pt-6">
        <button onclick="prevQuestion()" id="prevBtn"
          class="px-6 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold disabled:opacity-50">
          Previous
        </button>
        
        <button onclick="nextQuestion()" id="nextBtn"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Next
        </button>

        <button onclick="confirmSubmit()" id="submitBtn"
          class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold hidden">
          Submit Test
        </button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden text-center py-10">
      <h2 class="text-3xl font-bold mb-4">Test Submitted Successfully 🎉</h2>
      <div class="bg-blue-50 p-6 rounded-2xl inline-block mb-6">
        <p class="text-xl mb-2">Your Score: <span id="score" class="font-bold text-blue-600"></span> / <span id="total"></span></p>
        <p class="text-lg">Percentage: <span id="percent" class="font-bold text-blue-600"></span>%</p>
      </div>
      <br>
      <button onclick="location.reload()" class="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold">Restart Practice</button>
    </div>
    
  </div>

<script>
// 1. DATA ARRAY
const questions = [
  {q: "The number of protons in an atom of an element with atomic number 17 and mass number 35 is ___.", options: ["17", "18", "35", "52"], answer: "17"},
  {q: "Which of the following separation techniques is used to obtain pure water from sea water?", options: ["Filtration", "Evaporation", "Distillation", "Chromatography"], answer: "Distillation"},
  {q: "The shape of a molecule of water (H₂O) is ___.", options: ["Linear", "Bent (V-shaped)", "Tetrahedral", "Trigonal planar"], answer: "Bent (V-shaped)"},
  {q: "Which of the following elements has the highest electronegativity?", options: ["Chlorine", "Fluorine", "Oxygen", "Nitrogen"], answer: "Fluorine"},
  {q: "The oxidation state of Manganese (Mn) in KMnO₄ is ___.", options: ["+2", "+4", "+6", "+7"], answer: "+7"},
  {q: "Calculate the number of moles in 20g of NaOH. [Na=23, O=16, H=1]", options: ["0.2 mol", "0.5 mol", "1.0 mol", "2.0 mol"], answer: "0.5 mol"},
  {q: "According to Boyle's Law, the volume of a fixed mass of gas is inversely proportional to its ___.", options: ["Temperature", "Pressure", "Density", "Number of moles"], answer: "Pressure"},
  {q: "The bond formed between two elements with a large electronegativity difference is ___.", options: ["Covalent", "Ionic (Electrovalent)", "Metallic", "Dative"], answer: "Ionic (Electrovalent)"},
  {q: "Which of the following is a neutral oxide?", options: ["CO₂", "SO₂", "NO", "MgO"], answer: "NO"},
  {q: "The process of a solid changing directly into a gas is called ___.", options: ["Melting", "Evaporation", "Sublimation", "Condensation"], answer: "Sublimation"},
  {q: "What is the pH of a solution with a hydrogen ion concentration [H⁺] of 1.0 × 10⁻³ mol/dm³?", options: ["3", "7", "10", "11"], answer: "3"},
  {q: "Which of the following is an isotope of Hydrogen?", options: ["Protium", "Helium", "Lithium", "Beryllium"], answer: "Protium"},
  {q: "The functional group -COOH is characteristic of ___.", options: ["Alkanols", "Alkanoic acids", "Alkanals", "Alkanones"], answer: "Alkanoic acids"},
  {q: "In the reaction: Zn + CuSO₄ → ZnSO₄ + Cu, Zinc is acting as a/an ___.", options: ["Oxidizing agent", "Reducing agent", "Catalyst", "Inhibitor"], answer: "Reducing agent"},
  {q: "Which of the following is an example of a chemical change?", options: ["Melting of ice", "Dissolving salt in water", "Rusting of iron", "Boiling of water"], answer: "Rusting of iron"},
  {q: "The most abundant noble gas in the atmosphere is ___.", options: ["Helium", "Neon", "Argon", "Krypton"], answer: "Argon"},
  {q: "A solution that can dissolve more solute at a given temperature is said to be ___.", options: ["Saturated", "Unsaturated", "Supersaturated", "Concentrated"], answer: "Unsaturated"},
  {q: "The gas evolved when dilute HCl reacts with Na₂CO₃ is ___.", options: ["Hydrogen", "Oxygen", "Carbon (IV) oxide", "Chlorine"], answer: "Carbon (IV) oxide"},
  {q: "Which of the following indicators is suitable for a titration between a strong acid and a weak base?", options: ["Phenolphthalein", "Methyl orange", "Litmus", "Bromothymol blue"], answer: "Methyl orange"},
  {q: "The standard condition for temperature (STP) is ___.", options: ["0°C (273K)", "25°C (298K)", "100°C (373K)", "20°C (293K)"], answer: "0°C (273K)"},
  {q: "Calculate the molar mass of H₂SO₄. [H=1, S=32, O=16]", options: ["49 g/mol", "98 g/mol", "100 g/mol", "150 g/mol"], answer: "98 g/mol"},
  {q: "Which of the following particles has the least mass?", options: ["Proton", "Neutron", "Electron", "Alpha particle"], answer: "Electron"},
  {q: "The catalyst used in the Haber process for the manufacture of Ammonia is ___.", options: ["Vanadium (V) oxide", "Finely divided iron", "Platinum", "Manganese (IV) oxide"], answer: "Finely divided iron"},
  {q: "Which of the following represents an alkene?", options: ["C₂H₂", "C₂H₄", "C₂H₆", "CH₄"], answer: "C₂H₄"},
  {q: "Hardness of water is caused by the presence of ions of ___.", options: ["Na⁺ and K⁺", "Ca²⁺ and Mg²⁺", "Cu²⁺ and Zn²⁺", "Al³⁺ and Fe³⁺"], answer: "Ca²⁺ and Mg²⁺"},
  {q: "The property of an element to exist in two or more forms in the same physical state is ___.", options: ["Isomerism", "Isotopy", "Allotropy", "Polymerization"], answer: "Allotropy"},
  {q: "An electrochemical cell that converts chemical energy into electrical energy is a ___.", options: ["Voltaic (Galvanic) cell", "Electrolytic cell", "Downs cell", "Haber cell"], answer: "Voltaic (Galvanic) cell"},
  {q: "Which of the following is a strong electrolyte?", options: ["Ethanol", "Distilled water", "Dilute H₂SO₄", "Glucose solution"], answer: "Dilute H₂SO₄"},
  {q: "The type of bond in a Nitrogen molecule (N₂) is a ___.", options: ["Single covalent bond", "Double covalent bond", "Triple covalent bond", "Ionic bond"], answer: "Triple covalent bond"},
  {q: "The law which states that 'Energy can neither be created nor destroyed' is the ___.", options: ["First law of thermodynamics", "Second law of thermodynamics", "Hess's law", "Le Chatelier's principle"], answer: "First law of thermodynamics"},
  {q: "Which of the following gases is used in fire extinguishers?", options: ["Oxygen", "Nitrogen", "Carbon (IV) oxide", "Argon"], answer: "Carbon (IV) oxide"},
  {q: "The general formula for the Alkanol series is ___.", options: ["CₙH₂ₙ₊₂", "CₙH₂ₙ₊₁OH", "CₙH₂ₙ", "CₙH₂ₙ₋₂"], answer: "CₙH₂ₙ₊₁OH"},
  {q: "Chlorine bleaches by the process of ___.", options: ["Reduction", "Dehydration", "Oxidation", "Neutralization"], answer: "Oxidation"},
  {q: "The percentage by mass of Oxygen in CaCO₃ is ___? [Ca=40, C=12, O=16]", options: ["16%", "32%", "48%", "60%"], answer: "48%"},
  {q: "Which of the following is a greenhouse gas?", options: ["Nitrogen", "Oxygen", "Methane", "Argon"], answer: "Methane"},
  {q: "The Arrhenius definition of a base is a substance that dissociates in water to produce ___.", options: ["H⁺ ions", "OH⁻ ions", "Protons", "Electrons"], answer: "OH⁻ ions"},
  {q: "Which of the following represents a dative (coordinate) covalent bond?", options: ["NaCl", "H₂O", "NH₄⁺", "CH₄"], answer: "NH₄⁺"},
  {q: "The purity of a solid substance can be tested by its ___.", options: ["Boiling point", "Melting point", "Density", "Solubility"], answer: "Melting point"},
  {q: "Which of the following is the main constituent of natural gas?", options: ["Ethane", "Propane", "Methane", "Butane"], answer: "Methane"},
  {q: "The energy required to remove an electron from a gaseous atom is ___.", options: ["Electron affinity", "Electronegativity", "Ionization energy", "Lattice energy"], answer: "Ionization energy"},
  {q: "Alkanes undergo ___ reaction.", options: ["Addition", "Substitution", "Polymerization", "Fermentation"], answer: "Substitution"},
  {q: "The ionic product of water (Kₗᵥ) at 25°C is ___.", options: ["1.0 × 10⁻⁷", "1.0 × 10⁻¹⁴", "1.0 × 10⁷", "7.0"], answer: "1.0 × 10⁻¹⁴"},
  {q: "Which of the following is a polyester?", options: ["Nylon", "Terylene", "Polypropene", "Polystyrene"], answer: "Terylene"},
  {q: "The solubility of most gases in water ___ with an increase in temperature.", options: ["Increases", "Decreases", "Remains constant", "Fluctuates"], answer: "Decreases"},
  {q: "Which of the following metals is extracted by electrolysis of its molten ore?", options: ["Iron", "Copper", "Aluminium", "Lead"], answer: "Aluminium"},
  {q: "The process of heating an ore in the absence of air is ___.", options: ["Roasting", "Calcination", "Smelting", "Reduction"], answer: "Calcination"},
  {q: "An atom with electronic configuration 2, 8, 2 belongs to group ___.", options: ["1", "2", "3", "8"], answer: "2"},
  {q: "Which of the following is a physical property of Chlorine gas?", options: ["It is a bleaching agent", "It is greenish-yellow in color", "It supports combustion", "It reacts with metals"], answer: "It is greenish-yellow in color"},
  {q: "The unit of molarity is ___.", options: ["g/dm³", "mol/dm³", "mol/g", "g/mol"], answer: "mol/dm³"},
  {q: "Which of the following is a radioactive isotope used in medicine?", options: ["Carbon-14", "Cobalt-60", "Iodine-131", "Uranium-235"], answer: "Cobalt-60"}
];

// 2. STATE VARIABLES
let currentQ = 0;
let userAnswers = {};
let flaggedQs = {};
let timeLeft = 90 * 60; // 90 minutes in seconds
let timerInterval;

// 3. INITIALIZATION
document.getElementById('qTotal').innerText = questions.length;
loadQuestion();
startTimer();

// 4. CORE FUNCTIONS
function loadQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('questionText').innerText = q.q;

  // Load options
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.className = 'option-btn p-4 border-2 rounded-xl text-left font-medium transition-all';
    
    // Check if this option was already selected
    if(userAnswers[currentQ] === opt) {
        btn.classList.add('selected', 'border-blue-600');
    } else {
        btn.classList.add('border-gray-200');
    }
    
    btn.onclick = () => selectAnswer(opt);
    optionsDiv.appendChild(btn);
  });

  // Toggle Visibility of Nav Buttons
  document.getElementById('prevBtn').disabled = currentQ === 0;
  
  if (currentQ === questions.length - 1) {
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('submitBtn').classList.add('hidden');
  }

  updateQuestionGrid();
}

function selectAnswer(opt) {
  userAnswers[currentQ] = opt;
  loadQuestion(); 
}

function nextQuestion() {
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function jumpToQuestion(index) {
  currentQ = index;
  loadQuestion();
}

function flagQuestion() {
  flaggedQs[currentQ] = !flaggedQs[currentQ];
  updateQuestionGrid();
}

function updateQuestionGrid() {
  const grid = document.getElementById('question-grid');
  grid.innerHTML = '';
  
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    
    // Apply status colors
    if (i === currentQ) btn.classList.add('current');
    if (userAnswers[i]) btn.classList.add('attempted');
    if (flaggedQs[i]) btn.classList.add('flagged');
    
    grid.appendChild(btn);
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let hours = Math.floor(timeLeft / 3600);
    let mins = Math.floor((timeLeft % 3600) / 60);
    let secs = timeLeft % 60;
    
    let displayTime = hours > 0 
        ? `${hours}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
        : `${mins}:${secs.toString().padStart(2,'0')}`;
        
    document.getElementById('timer').innerText = `Time: ${displayTime}`;
    
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      submitTest();
    }
  }, 1000);
}

function confirmSubmit() {
    if(confirm("Are you sure you want to submit your test?")) {
        submitTest();
    }
}

function submitTest() {
  clearInterval(timerInterval);
  
  let score = 0;
  questions.forEach((q, i) => {
    if(userAnswers[i] === q.answer) {
        score++;
    }
  });
  
  let percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('question-area').classList.add('hidden');
  document.getElementById('question-grid').parentElement.classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('percent').innerText = percent;
}
</script>
</body>
</html>
