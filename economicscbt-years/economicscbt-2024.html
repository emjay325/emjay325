<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Economics CBT 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .option-btn:hover { background-color: #dbeafe; }
   .option-btn.selected { background-color: #2563eb; color: white; }
   .flagged { background-color: #fbbf24 !important; color: black !important; }
   .attempted { background-color: #10b981 !important; color: white !important; }
   .current { border: 3px solid #2563eb !important; }
   #question-grid button { 
     width: 35px; height: 35px; 
     background: #e5e7eb; 
     border-radius: 6px; 
     font-weight: bold;
     font-size: 12px;
     transition: all 0.2s;
   }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div id="cbt-container" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-2xl font-bold">Sample WAEC-style CBT</h1>
      <div id="timer" class="text-xl font-bold text-red-600">Time: 90:00</div>
    </div>

    <!-- Question Grid + Review Button -->
    <div class="bg-gray-50 p-4 rounded-xl mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-bold text-gray-700">Question Navigation</span>
        <button onclick="flagQuestion()" class="px-4 py-1 bg-yellow-400 hover:bg-yellow-500 rounded-lg font-semibold text-sm flex items-center gap-1">
          Review Later 🔍
        </button>
      </div>
      <div id="question-grid" class="grid grid-cols-10 gap-2">
        <!-- JS will populate buttons here -->
      </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="question-area">
      <div class="flex justify-between items-center mb-2">
        <p class="text-sm text-gray-600">Question <span id="qNum">1</span> of <span id="qTotal">10</span></p>
      </div>
      <h2 id="questionText" class="text-xl font-semibold mb-6 min-h-[60px]"></h2>
      
      <div id="options" class="grid gap-3 mb-8"></div>

      <div class="flex justify-between border-t pt-6">
        <button onclick="prevQuestion()" id="prevBtn"
          class="px-6 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold disabled:opacity-50">
          Previous
        </button>
        
        <button onclick="nextQuestion()" id="nextBtn"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Next
        </button>

        <button onclick="confirmSubmit()" id="submitBtn"
          class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold hidden">
          Submit Test
        </button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden text-center py-10">
      <h2 class="text-3xl font-bold mb-4">Test Submitted Successfully 🎉</h2>
      <div class="bg-blue-50 p-6 rounded-2xl inline-block mb-6">
        <p class="text-xl mb-2">Your Score: <span id="score" class="font-bold text-blue-600"></span> / <span id="total"></span></p>
        <p class="text-lg">Percentage: <span id="percent" class="font-bold text-blue-600"></span>%</p>
      </div>
      <br>
      <button onclick="location.reload()" class="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold">Restart Practice</button>
    </div>
    
  </div>

<script>
// 1. DATA ARRAY
const questions = [
  {q: "The study of Economics is important because it enables us to ___.", options: ["Earn more money", "Maximize satisfaction from limited resources", "Control the government", "Eliminate poverty completely"], answer: "Maximize satisfaction from limited resources"},
  {q: "A shift in the supply curve to the right indicates ___.", options: ["A decrease in supply", "An increase in supply", "A change in price", "A movement along the curve"], answer: "An increase in supply"},
  {q: "The value of the next best alternative forgone is known as ___.", options: ["Social cost", "Total cost", "Opportunity cost", "Average cost"], answer: "Opportunity cost"},
  {q: "Which of the following is a characteristic of an inferior good?", options: ["Demand increases as income increases", "Demand decreases as income increases", "It is a luxury item", "It has a high price"], answer: "Demand decreases as income increases"},
  {q: "Production is defined as the creation of ___.", options: ["Goods only", "Services only", "Utility", "Wealth"], answer: "Utility"},
  {q: "A firm that merges with another firm at a different stage of the same production process is undergoing ___.", options: ["Horizontal integration", "Vertical integration", "Conglomerate merger", "Lateral integration"], answer: "Vertical integration"},
  {q: "The marginal product of labour is the ___.", options: ["Total output divided by labour", "Change in total output per unit change in labour", "Total revenue from labour", "Average output of labour"], answer: "Change in total output per unit change in labour"},
  {q: "Which of the following is a reward for entrepreneurship?", options: ["Wages", "Interest", "Rent", "Profit"], answer: "Profit"},
  {q: "An indifference curve shows combinations of two goods that give the consumer ___.", options: ["The same level of satisfaction", "Increasing satisfaction", "Minimum satisfaction", "Different levels of satisfaction"], answer: "The same level of satisfaction"},
  {q: "Price elasticity of supply measures the responsiveness of quantity supplied to a change in ___.", options: ["Income", "Demand", "Price", "Taste"], answer: "Price"},
  {q: "A market with many buyers and many sellers of a homogeneous product is ___.", options: ["A monopoly", "An oligopoly", "A perfect competition", "A monopsony"], answer: "A perfect competition"},
  {q: "The price of a commodity is determined by the interaction of ___.", options: ["Utility and cost", "Supply and demand", "Government and producers", "Wholesalers and retailers"], answer: "Supply and demand"},
  {q: "What happens to a firm's total revenue if demand is elastic and price falls?", options: ["It remains constant", "It decreases", "It increases", "It falls to zero"], answer: "It increases"},
  {q: "The most important function of the wholesaler to the producer is ___.", options: ["Selling in small units", "Advertising the goods", "Bulk breaking and providing storage", "Financing the consumer"], answer: "Bulk breaking and providing storage"},
  {q: "A legal tender is any form of money that ___.", options: ["Is made of gold", "Is backed by the government for payment of debts", "Is accepted by everyone voluntarily", "Is easily portable"], answer: "Is backed by the government for payment of debts"},
  {q: "The quantity theory of money states that a change in money supply leads to a proportional change in ___.", options: ["Interest rates", "Price level", "Employment", "Investment"], answer: "Price level"},
  {q: "A major function of the Central Bank of Nigeria is to ___.", options: ["Accept deposits from the public", "Lend money to individuals", "Issue currency", "Competitive with commercial banks"], answer: "Issue currency"},
  {q: "The process of selling government-owned enterprises to private individuals is ___.", options: ["Nationalization", "Commercialization", "Privatization", "Indigenization"], answer: "Privatization"},
  {q: "Inflation that occurs when the economy is at full employment is usually ___.", options: ["Cost-push inflation", "Demand-pull inflation", "Hyperinflation", "Structural inflation"], answer: "Demand-pull inflation"},
  {q: "A country has a comparative advantage in the production of a good if ___.", options: ["It can produce more of it than others", "It produces it at a lower opportunity cost", "The government subsidizes it", "It is a primary product"], answer: "It produces it at a lower opportunity cost"},
  {q: "Visible and invisible exports and imports are recorded in the ___.", options: ["Capital account", "Current account", "Budget account", "National account"], answer: "Current account"},
  {q: "A situation where a country's export value is less than its import value is a ___.", options: ["Trade surplus", "Trade deficit", "Balanced trade", "Favorable balance"], answer: "Trade deficit"},
  {q: "The major source of government revenue in Nigeria is ___.", options: ["Income tax", "Value Added Tax", "Petroleum profits", "Agriculture"], answer: "Petroleum profits"},
  {q: "A tax that takes a higher percentage of income from the poor than the rich is ___.", options: ["Progressive", "Regressive", "Proportional", "Ad-valorem"], answer: "Regressive"},
  {q: "The National Income of a country can be measured by the ___.", options: ["Expenditure, Income, and Output methods", "Profit and Loss method", "Census method", "Import and Export method"], answer: "Expenditure, Income, and Output methods"},
  {q: "The difference between Gross National Product and Net National Product is ___.", options: ["Indirect taxes", "Subsidies", "Depreciation", "Net income from abroad"], answer: "Depreciation"},
  {q: "In a circular flow of income, an injection includes ___.", options: ["Savings", "Taxes", "Investment", "Imports"], answer: "Investment"},
  {q: "Malthus predicted that population grows at a ___.", options: ["Geometric progression", "Arithmetic progression", "Constant rate", "Diminishing rate"], answer: "Geometric progression"},
  {q: "Labour force refers to the total number of people who are ___.", options: ["Living in a country", "Above 18 years old", "Employed or actively seeking work", "Retired and working"], answer: "Employed or actively seeking work"},
  {q: "The range of a set of data is the ___.", options: ["Average of the values", "Middle value", "Difference between the highest and lowest values", "Most frequent value"], answer: "Difference between the highest and lowest values"},
  {q: "Which of the following is a measure of central tendency?", options: ["Standard deviation", "Mean", "Variance", "Range"], answer: "Mean"},
  {q: "If the mean of 4, 6, and x is 6, what is x?", options: ["6", "7", "8", "10"], answer: "8"},
  {q: "The term of trade is the ratio of ___.", options: ["Export price to import price", "Export volume to import volume", "Total revenue to total cost", "Money supply to price level"], answer: "Export price to import price"},
  {q: "A tariff is primarily intended to ___.", options: ["Increase imports", "Protect infant industries", "Reduce government revenue", "Encourage dumping"], answer: "Protect infant industries"},
  {q: "ECOWAS is an example of a ___.", options: ["Free trade area", "Customs union", "Economic community", "Political party"], answer: "Economic community"},
  {q: "The type of unemployment that occurs during an economic recession is ___.", options: ["Frictional", "Cyclical", "Seasonal", "Structural"], answer: "Cyclical"},
  {q: "Money serves as a 'standard of deferred payment' when it is used to ___.", options: ["Buy goods now", "Settle debts in the future", "Compare values of goods", "Keep wealth for the future"], answer: "Settle debts in the future"},
  {q: "Diminishing returns sets in when ___.", options: ["Total product starts to fall", "Marginal product starts to fall", "Average product is zero", "Fixed factors are increased"], answer: "Marginal product starts to fall"},
  {q: "A consumer is in equilibrium when the ratio of marginal utility to price is ___ for all goods.", options: ["Zero", "Increasing", "Equal", "Negative"], answer: "Equal"},
  {q: "Which of the following is an example of a fixed cost?", options: ["Cost of raw materials", "Electricity bills based on usage", "Rent on factory building", "Wages of casual workers"], answer: "Rent on factory building"},
  {q: "A monopoly's demand curve is usually ___.", options: ["Horizontal", "Vertical", "Downward sloping", "Upward sloping"], answer: "Downward sloping"},
  {q: "The main objective of a private firm is ___.", options: ["Welfare of the public", "Profit maximization", "Price stability", "Provision of employment"], answer: "Profit maximization"},
  {q: "Devaluation of a currency means ___.", options: ["Reducing its value in terms of other currencies", "Increasing its value in terms of gold", "Printing more money", "Reducing interest rates"], answer: "Reducing its value in terms of other currencies"},
  {q: "What is the median of the numbers 2, 5, 8, 4, 10?", options: ["4", "5", "8", "10"], answer: "5"},
  {q: "Externalities in economics refer to ___.", options: ["Taxes paid by firms", "Costs or benefits affecting third parties", "Exports and imports", "Government spending"], answer: "Costs or benefits affecting third parties"},
  {q: "Economic growth is best defined as a steady increase in ___.", options: ["Price levels", "Total population", "Real Gross Domestic Product", "Foreign aid"], answer: "Real Gross Domestic Product"},
  {q: "The bank rate is the rate at which the ___.", options: ["Public borrows from commercial banks", "Central bank borrows from the government", "Central bank lends to commercial banks", "Commercial banks lend to each other"], answer: "Central bank lends to commercial banks"},
  {q: "Capital as a factor of production refers to ___.", options: ["Money in the bank", "Man-made assets used for further production", "Natural resources", "Human skills"], answer: "Man-made assets used for further production"},
  {q: "The formula for calculating the price index is current price divided by base year price ___ 100.", options: ["plus", "minus", "multiplied by", "divided by"], answer: "multiplied by"},
  {q: "In a socialist economy, the 'what to produce' question is answered by ___.", options: ["The price mechanism", "The central planning authority", "Individual consumers", "Profit motives"], answer: "The central planning authority"}
];

// 2. STATE VARIABLES
let currentQ = 0;
let userAnswers = {};
let flaggedQs = {};
let timeLeft = 90 * 60; // 90 minutes in seconds
let timerInterval;

// 3. INITIALIZATION
document.getElementById('qTotal').innerText = questions.length;
loadQuestion();
startTimer();

// 4. CORE FUNCTIONS
function loadQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('questionText').innerText = q.q;

  // Load options
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.className = 'option-btn p-4 border-2 rounded-xl text-left font-medium transition-all';
    
    // Check if this option was already selected
    if(userAnswers[currentQ] === opt) {
        btn.classList.add('selected', 'border-blue-600');
    } else {
        btn.classList.add('border-gray-200');
    }
    
    btn.onclick = () => selectAnswer(opt);
    optionsDiv.appendChild(btn);
  });

  // Toggle Visibility of Nav Buttons
  document.getElementById('prevBtn').disabled = currentQ === 0;
  
  if (currentQ === questions.length - 1) {
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('submitBtn').classList.add('hidden');
  }

  updateQuestionGrid();
}

function selectAnswer(opt) {
  userAnswers[currentQ] = opt;
  loadQuestion(); 
}

function nextQuestion() {
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function jumpToQuestion(index) {
  currentQ = index;
  loadQuestion();
}

function flagQuestion() {
  flaggedQs[currentQ] = !flaggedQs[currentQ];
  updateQuestionGrid();
}

function updateQuestionGrid() {
  const grid = document.getElementById('question-grid');
  grid.innerHTML = '';
  
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    
    // Apply status colors
    if (i === currentQ) btn.classList.add('current');
    if (userAnswers[i]) btn.classList.add('attempted');
    if (flaggedQs[i]) btn.classList.add('flagged');
    
    grid.appendChild(btn);
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let hours = Math.floor(timeLeft / 3600);
    let mins = Math.floor((timeLeft % 3600) / 60);
    let secs = timeLeft % 60;
    
    let displayTime = hours > 0 
        ? `${hours}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
        : `${mins}:${secs.toString().padStart(2,'0')}`;
        
    document.getElementById('timer').innerText = `Time: ${displayTime}`;
    
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      submitTest();
    }
  }, 1000);
}

function confirmSubmit() {
    if(confirm("Are you sure you want to submit your test?")) {
        submitTest();
    }
}

function submitTest() {
  clearInterval(timerInterval);
  
  let score = 0;
  questions.forEach((q, i) => {
    if(userAnswers[i] === q.answer) {
        score++;
    }
  });
  
  let percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('question-area').classList.add('hidden');
  document.getElementById('question-grid').parentElement.classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('percent').innerText = percent;
}
</script>
</body>
</html>
