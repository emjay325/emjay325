<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Literature CBT 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .option-btn:hover { background-color: #dbeafe; }
   .option-btn.selected { background-color: #2563eb; color: white; }
   .flagged { background-color: #fbbf24 !important; color: black !important; }
   .attempted { background-color: #10b981 !important; color: white !important; }
   .current { border: 3px solid #2563eb !important; }
   #question-grid button { 
     width: 35px; height: 35px; 
     background: #e5e7eb; 
     border-radius: 6px; 
     font-weight: bold;
     font-size: 12px;
     transition: all 0.2s;
   }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div id="cbt-container" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-2xl font-bold">Sample WAEC-style CBT</h1>
      <div id="timer" class="text-xl font-bold text-red-600">Time: 90:00</div>
    </div>

    <!-- Question Grid + Review Button -->
    <div class="bg-gray-50 p-4 rounded-xl mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-bold text-gray-700">Question Navigation</span>
        <button onclick="flagQuestion()" class="px-4 py-1 bg-yellow-400 hover:bg-yellow-500 rounded-lg font-semibold text-sm flex items-center gap-1">
          Review Later 🔍
        </button>
      </div>
      <div id="question-grid" class="grid grid-cols-10 gap-2">
        <!-- JS will populate buttons here -->
      </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="question-area">
      <div class="flex justify-between items-center mb-2">
        <p class="text-sm text-gray-600">Question <span id="qNum">1</span> of <span id="qTotal">10</span></p>
      </div>
      <h2 id="questionText" class="text-xl font-semibold mb-6 min-h-[60px]"></h2>
      
      <div id="options" class="grid gap-3 mb-8"></div>

      <div class="flex justify-between border-t pt-6">
        <button onclick="prevQuestion()" id="prevBtn"
          class="px-6 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold disabled:opacity-50">
          Previous
        </button>
        
        <button onclick="nextQuestion()" id="nextBtn"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Next
        </button>

        <button onclick="confirmSubmit()" id="submitBtn"
          class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold hidden">
          Submit Test
        </button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden text-center py-10">
      <h2 class="text-3xl font-bold mb-4">Test Submitted Successfully 🎉</h2>
      <div class="bg-blue-50 p-6 rounded-2xl inline-block mb-6">
        <p class="text-xl mb-2">Your Score: <span id="score" class="font-bold text-blue-600"></span> / <span id="total"></span></p>
        <p class="text-lg">Percentage: <span id="percent" class="font-bold text-blue-600"></span>%</p>
      </div>
      <br>
      <button onclick="location.reload()" class="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold">Restart Practice</button>
    </div>
    
  </div>

<script>
// 1. DATA ARRAY
const questions = [
  {q: "A figure of speech which makes a comparison between two unlike things using 'as' or 'like' is known as ___.", options: ["Metaphor", "Simile", "Personification", "Oxymoron"], answer: "Simile"},
  {q: "The main character in a play or novel is often referred to as the ___.", options: ["Antagonist", "Villain", "Protagonist", "Narrator"], answer: "Protagonist"},
  {q: "A speech made by a character alone on stage to reveal their inner thoughts is a ___.", options: ["Dialogue", "Monologue", "Soliloquy", "Prologue"], answer: "Soliloquy"},
  {q: "The use of a word whose sound suggests its meaning is called ___.", options: ["Alliteration", "Onomatopoeia", "Assonance", "Pun"], answer: "Onomatopoeia"},
  {q: "A poem of fourteen lines with a specific rhyme scheme is a ___.", options: ["Lyric", "Ballad", "Sonnet", "Ode"], answer: "Sonnet"},
  {q: "The resolution of a plot in a tragedy is also known as the ___.", options: ["Climax", "Denouement", "Catastrophe", "Exposition"], answer: "Catastrophe"},
  {q: "Giving human qualities to non human objects is known as ___.", options: ["Hyperbole", "Personification", "Irony", "Paradox"], answer: "Personification"},
  {q: "A play that ends on a happy note is generally classified as a ___.", options: ["Tragedy", "Farce", "Comedy", "Melodrama"], answer: "Comedy"},
  {q: "The pattern of rhymes at the end of the lines of a poem is the ___.", options: ["Rhythm", "Meter", "Rhyme scheme", "Stanza"], answer: "Rhyme scheme"},
  {q: "A deliberate exaggeration for emphasis is called ___.", options: ["Litotes", "Hyperbole", "Euphemism", "Metonymy"], answer: "Hyperbole"},
  {q: "The time and place in which a story happens is the ___.", options: ["Plot", "Setting", "Theme", "Atmosphere"], answer: "Setting"},
  {q: "A character who provides a contrast to the protagonist is a ___.", options: ["Hero", "Foil", "Peer", "Mentor"], answer: "Foil"},
  {q: "The central idea or message of a literary work is its ___.", options: ["Subject", "Plot", "Theme", "Conflict"], answer: "Theme"},
  {q: "Which figure of speech is used in the phrase 'The heavy clouds wept'?", options: ["Synecdoche", "Personification", "Paradox", "Irony"], answer: "Personification"},
  {q: "A short poem expressing the personal emotions or feelings of the speaker is a ___.", options: ["Narrative", "Epic", "Lyric", "Ballad"], answer: "Lyric"},
  {q: "The choice and use of words in writing is known as ___.", options: ["Syntax", "Diction", "Tone", "Style"], answer: "Diction"},
  {q: "An address to an absent person or a personified object is called ___.", options: ["Apostrophe", "Epilogue", "Eulogy", "Allusion"], answer: "Apostrophe"},
  {q: "A play or story intended to teach a moral lesson is ___.", options: ["Satire", "Didactic", "Allegory", "Parody"], answer: "Didactic"},
  {q: "The repetition of vowel sounds in a line of poetry is ___.", options: ["Alliteration", "Assonance", "Consonance", "Onomatopoeia"], answer: "Assonance"},
  {q: "The point of highest tension or interest in a plot is the ___.", options: ["Falling action", "Exposition", "Climax", "Rising action"], answer: "Climax"},
  {q: "The use of light and funny scenes to interrupt a serious or tragic dramatic work is ___.", options: ["Tragic irony", "Comic relief", "Satire", "Farce"], answer: "Comic relief"},
  {q: "Which of these is a long narrative poem celebrating the deeds of a hero?", options: ["Sonnet", "Epic", "Haiku", "Elegy"], answer: "Epic"},
  {q: "A hint or clue of what is to come later in a story is ___.", options: ["Flashback", "Foreshadowing", "Suspense", "Irony"], answer: "Foreshadowing"},
  {q: "A poem written to mourn the death of a person is an ___.", options: ["Ode", "Elegy", "Epigram", "Epitaph"], answer: "Elegy"},
  {q: "The words spoken by characters in a play is the ___.", options: ["Prologue", "Epilogue", "Dialogue", "Script"], answer: "Dialogue"},
  {q: "Which figure of speech expresses a bitter or mocking remark?", options: ["Sarcasm", "Euphemism", "Allusion", "Metaphor"], answer: "Sarcasm"},
  {q: "A stanza of four lines is called a ___.", options: ["Couplet", "Tercet", "Quatrain", "Sestet"], answer: "Quatrain"},
  {q: "A reference to a well known person, place, or event in history or literature is an ___.", options: ["Allegory", "Alliteration", "Allusion", "Analogy"], answer: "Allusion"},
  {q: "The person telling the story in a novel is the ___.", options: ["Author", "Narrator", "Persona", "Protagonist"], answer: "Narrator"},
  {q: "A struggle between opposing forces in a story is the ___.", options: ["Climax", "Conflict", "Suspense", "Resolution"], answer: "Conflict"},
  {q: "A mild or pleasant word used instead of one that is harsh or offensive is a ___.", options: ["Litotes", "Euphemism", "Oxymoron", "Pun"], answer: "Euphemism"},
  {q: "Two lines of verse that rhyme and have the same meter are a ___.", options: ["Sestet", "Octave", "Couplet", "Quatrain"], answer: "Couplet"},
  {q: "The use of humor, irony, or ridicule to expose and criticize human vice is ___.", options: ["Satire", "Farce", "Parody", "Tragedy"], answer: "Satire"},
  {q: "A statement that appears self contradictory but reveals a truth is a ___.", options: ["Metaphor", "Paradox", "Oxymoron", "Irony"], answer: "Paradox"},
  {q: "The attitude of the author toward the subject or audience is the ___.", options: ["Mood", "Tone", "Style", "Diction"], answer: "Tone"},
  {q: "An introduction to a play or a long poem is the ___.", options: ["Epilogue", "Prologue", "Preface", "Foreword"], answer: "Prologue"},
  {q: "When a character speaks to the audience and the other characters on stage are not supposed to hear, it is an ___.", options: ["Aside", "Soliloquy", "Monologue", "Interior monologue"], answer: "Aside"},
  {q: "Literature that is based on the imagination and not on facts is ___.", options: ["Non fiction", "Biography", "Fiction", "Autobiography"], answer: "Fiction"},
  {q: "The repetition of initial consonant sounds in a line of poetry is ___.", options: ["Assonance", "Alliteration", "Consonance", "Rhythm"], answer: "Alliteration"},
  {q: "A character who does not change throughout the story is a ___.", options: ["Dynamic character", "Static character", "Round character", "Flat character"], answer: "Static character"},
  {q: "The error of judgment or character flaw that leads to the downfall of a tragic hero is ___.", options: ["Hubris", "Hamartia", "Nemesis", "Catharsis"], answer: "Hamartia"},
  {q: "Which literary genre uses actors to perform stories on a stage?", options: ["Poetry", "Prose", "Drama", "Non fiction"], answer: "Drama"},
  {q: "A story that uses symbols to convey a deeper moral or political meaning is an ___.", options: ["Allusion", "Allegory", "Anecdote", "Autobiography"], answer: "Allegory"},
  {q: "The feeling or atmosphere a writer creates for the reader is the ___.", options: ["Tone", "Mood", "Theme", "Voice"], answer: "Mood"},
  {q: "A play that mocks a serious work in a light or humorous way is a ___.", options: ["Satire", "Parody", "Tragedy", "Melodrama"], answer: "Parody"},
  {q: "Excessive pride which often leads to the downfall of a hero is ___.", options: ["Hamartia", "Hubris", "Catharsis", "Irony"], answer: "Hubris"},
  {q: "An imitation of a serious work using low or vulgar language is ___.", options: ["Burlesque", "Comedy", "Farce", "Satire"], answer: "Burlesque"},
  {q: "The purging or release of emotions like pity and fear by the audience at the end of a tragedy is ___.", options: ["Hubris", "Hamartia", "Catharsis", "Climax"], answer: "Catharsis"},
  {q: "A figure of speech in which two contradictory terms are combined is an ___.", options: ["Paradox", "Metaphor", "Oxymoron", "Pun"], answer: "Oxymoron"},
  {q: "A story that explains the origin of the world or natural phenomena is a ___.", options: ["Legend", "Fable", "Myth", "Folktale"], answer: "Myth"}
];

// 2. STATE VARIABLES
let currentQ = 0;
let userAnswers = {};
let flaggedQs = {};
let timeLeft = 90 * 60; // 90 minutes in seconds
let timerInterval;

// 3. INITIALIZATION
document.getElementById('qTotal').innerText = questions.length;
loadQuestion();
startTimer();

// 4. CORE FUNCTIONS
function loadQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('questionText').innerText = q.q;

  // Load options
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.className = 'option-btn p-4 border-2 rounded-xl text-left font-medium transition-all';
    
    // Check if this option was already selected
    if(userAnswers[currentQ] === opt) {
        btn.classList.add('selected', 'border-blue-600');
    } else {
        btn.classList.add('border-gray-200');
    }
    
    btn.onclick = () => selectAnswer(opt);
    optionsDiv.appendChild(btn);
  });

  // Toggle Visibility of Nav Buttons
  document.getElementById('prevBtn').disabled = currentQ === 0;
  
  if (currentQ === questions.length - 1) {
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('submitBtn').classList.add('hidden');
  }

  updateQuestionGrid();
}

function selectAnswer(opt) {
  userAnswers[currentQ] = opt;
  loadQuestion(); 
}

function nextQuestion() {
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function jumpToQuestion(index) {
  currentQ = index;
  loadQuestion();
}

function flagQuestion() {
  flaggedQs[currentQ] = !flaggedQs[currentQ];
  updateQuestionGrid();
}

function updateQuestionGrid() {
  const grid = document.getElementById('question-grid');
  grid.innerHTML = '';
  
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    
    // Apply status colors
    if (i === currentQ) btn.classList.add('current');
    if (userAnswers[i]) btn.classList.add('attempted');
    if (flaggedQs[i]) btn.classList.add('flagged');
    
    grid.appendChild(btn);
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let hours = Math.floor(timeLeft / 3600);
    let mins = Math.floor((timeLeft % 3600) / 60);
    let secs = timeLeft % 60;
    
    let displayTime = hours > 0 
        ? `${hours}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
        : `${mins}:${secs.toString().padStart(2,'0')}`;
        
    document.getElementById('timer').innerText = `Time: ${displayTime}`;
    
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      submitTest();
    }
  }, 1000);
}

function confirmSubmit() {
    if(confirm("Are you sure you want to submit your test?")) {
        submitTest();
    }
}

function submitTest() {
  clearInterval(timerInterval);
  
  let score = 0;
  questions.forEach((q, i) => {
    if(userAnswers[i] === q.answer) {
        score++;
    }
  });
  
  let percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('question-area').classList.add('hidden');
  document.getElementById('question-grid').parentElement.classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('percent').innerText = percent;
}
</script>
</body>
</html>
