<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CBT 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-green-600 mb-6">Create Account</h2>
        
        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700">Full Name:</label>
                <input type="text" id="signupName" placeholder="Enter full name" required
                    class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Email Address:</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required
                    class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Create Password:</label>
                <input type="password" id="signupPass" placeholder="Min 6 characters" required
                    class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-300">
                Sign Up
            </button>
        </form>

        <p class="text-sm text-center text-gray-500 mt-4">
            Already have an account? <a href="login.html" class="text-green-600 font-bold hover:underline">Login here</a>
        </p>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPass').value;

            // 1. Get existing users from browser memory
            let users = JSON.parse(localStorage.getItem('cbt_users')) || [];

            // 2. Check if email is already used
            const userExists = users.find(u => u.email === email);
            if (userExists) {
                alert("An account with this email already exists!");
                return;
            }

            // 3. Save new user info
            users.push({ name: name, email: email, password: pass });
            localStorage.setItem('cbt_users', JSON.stringify(users));

            alert("Account Created Successfully!");
            window.location.href = "login.html"; // Send them to login page
        });
    </script>
</body>
</html>
