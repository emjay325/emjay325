<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agric CBT 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .option-btn:hover { background-color: #dbeafe; }
   .option-btn.selected { background-color: #2563eb; color: white; }
   .flagged { background-color: #fbbf24 !important; color: black !important; }
   .attempted { background-color: #10b981 !important; color: white !important; }
   .current { border: 3px solid #2563eb !important; }
   #question-grid button { 
     width: 35px; height: 35px; 
     background: #e5e7eb; 
     border-radius: 6px; 
     font-weight: bold;
     font-size: 12px;
     transition: all 0.2s;
   }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div id="cbt-container" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-2xl font-bold">Sample WAEC-style CBT</h1>
      <div id="timer" class="text-xl font-bold text-red-600">Time: 90:00</div>
    </div>

    <!-- Question Grid + Review Button -->
    <div class="bg-gray-50 p-4 rounded-xl mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-bold text-gray-700">Question Navigation</span>
        <button onclick="flagQuestion()" class="px-4 py-1 bg-yellow-400 hover:bg-yellow-500 rounded-lg font-semibold text-sm flex items-center gap-1">
          Review Later 🔍
        </button>
      </div>
      <div id="question-grid" class="grid grid-cols-10 gap-2">
        <!-- JS will populate buttons here -->
      </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="question-area">
      <div class="flex justify-between items-center mb-2">
        <p class="text-sm text-gray-600">Question <span id="qNum">1</span> of <span id="qTotal">10</span></p>
      </div>
      <h2 id="questionText" class="text-xl font-semibold mb-6 min-h-[60px]"></h2>
      
      <div id="options" class="grid gap-3 mb-8"></div>

      <div class="flex justify-between border-t pt-6">
        <button onclick="prevQuestion()" id="prevBtn"
          class="px-6 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold disabled:opacity-50">
          Previous
        </button>
        
        <button onclick="nextQuestion()" id="nextBtn"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Next
        </button>

        <button onclick="confirmSubmit()" id="submitBtn"
          class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold hidden">
          Submit Test
        </button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden text-center py-10">
      <h2 class="text-3xl font-bold mb-4">Test Submitted Successfully 🎉</h2>
      <div class="bg-blue-50 p-6 rounded-2xl inline-block mb-6">
        <p class="text-xl mb-2">Your Score: <span id="score" class="font-bold text-blue-600"></span> / <span id="total"></span></p>
        <p class="text-lg">Percentage: <span id="percent" class="font-bold text-blue-600"></span>%</p>
      </div>
      <br>
      <button onclick="location.reload()" class="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold">Restart Practice</button>
    </div>
    
  </div>

<script>
// 1. DATA ARRAY
const questions = [
  {q: "Which of the following is the most important factor that determines the type of vegetation in a region?", options: ["Soil type", "Climate", "Topography", "Biotic factors"], answer: "Climate"},
  {q: "The process of providing water to crops through artificial means is known as ___.", options: ["Drainage", "Mulching", "Irrigation", "Transpiration"], answer: "Irrigation"},
  {q: "Which of the following soil types has the highest water holding capacity?", options: ["Sandy soil", "Loamy soil", "Clay soil", "Silt soil"], answer: "Clay soil"},
  {q: "In agriculture, the acronym NPK stands for ___.", options: ["Neon, Phosphorus, Potassium", "Nitrogen, Phosphorus, Potassium", "Nitrogen, Potassium, Krypton", "Sodium, Phosphorus, Potassium"], answer: "Nitrogen, Phosphorus, Potassium"},
  {q: "The practice of growing different crops on the same piece of land in a planned sequence is called ___.", options: ["Mixed farming", "Monoculture", "Crop rotation", "Shifting cultivation"], answer: "Crop rotation"},
  {q: "Which of the following is a leguminous plant?", options: ["Maize", "Cassava", "Cowpea", "Yam"], answer: "Cowpea"},
  {q: "The device used to measure the humidity of the air is the ___.", options: ["Anemometer", "Hygrometer", "Rain gauge", "Thermometer"], answer: "Hygrometer"},
  {q: "The primary reason for adding lime to agricultural soil is to ___.", options: ["Increase soil acidity", "Reduce soil alkalinity", "Reduce soil acidity", "Kill soil pests"], answer: "Reduce soil acidity"},
  {q: "Which of the following farm tools is used for transplanting seedlings?", options: ["Hand fork", "Spade", "Hand trowel", "Garden rake"], answer: "Hand trowel"},
  {q: "A major pest of cocoa in West Africa is the ___.", options: ["Bollworm", "Mirid bug", "Stem borer", "Weevil"], answer: "Mirid bug"},
  {q: "Which part of the digestive system of a ruminant is known as the true stomach?", options: ["Rumen", "Reticulum", "Omasum", "Abomasum"], answer: "Abomasum"},
  {q: "The process of removing the outer covering of a seed is called ___.", options: ["Winnowing", "Threshing", "Dehusking", "Milling"], answer: "Dehusking"},
  {q: "Which of the following is a method of vegetative propagation?", options: ["Seed sowing", "Grafting", "Pollination", "Fertilization"], answer: "Grafting"},
  {q: "The science of growing and managing forests is called ___.", options: ["Horticulture", "Floriculture", "Silviculture", "Agronomy"], answer: "Silviculture"},
  {q: "Which of these is a biotic factor affecting agricultural production?", options: ["Temperature", "Parasites", "Soil pH", "Rainfall"], answer: "Parasites"},
  {q: "Which of the following farm animals is a non ruminant?", options: ["Cattle", "Sheep", "Pig", "Goat"], answer: "Pig"},
  {q: "The practice of leaving a piece of land uncultivated for a period of time to restore its fertility is ___.", options: ["Mulching", "Fallowing", "Terracing", "Cover cropping"], answer: "Fallowing"},
  {q: "An example of a poultry disease caused by a virus is ___.", options: ["Coccidiosis", "Newcastle disease", "Tuberculosis", "Fowl cholera"], answer: "Newcastle disease"},
  {q: "The land tenure system that involves the inheritance of land from ancestors is ___.", options: ["Leasehold", "Communal land tenure", "Individual land tenure", "Rent"], answer: "Communal land tenure"},
  {q: "A farm machine used for making ridges is a ___.", options: ["Plough", "Harrow", "Ridger", "Planter"], answer: "Ridger"},
  {q: "Which of the following is a primary source of farm power in West Africa?", options: ["Wind power", "Human power", "Solar power", "Nuclear power"], answer: "Human power"},
  {q: "The act of giving birth in pigs is called ___.", options: ["Calving", "Farrowing", "Lambing", "Kindling"], answer: "Farrowing"},
  {q: "Which of the following is an oil crop?", options: ["Cotton", "Groundnut", "Sisal", "Rubber"], answer: "Groundnut"},
  {q: "Which soil nutrient is essential for the formation of chlorophyll?", options: ["Potassium", "Calcium", "Magnesium", "Phosphorus"], answer: "Magnesium"},
  {q: "The removal of excess branches from a plant is known as ___.", options: ["Thinning", "Pruning", "Mulching", "Weeding"], answer: "Pruning"},
  {q: "A major function of the liver in farm animals is ___.", options: ["Secretion of insulin", "Production of bile", "Digestion of fiber", "Absorption of water"], answer: "Production of bile"},
  {q: "Which of the following is an example of an inorganic fertilizer?", options: ["Green manure", "Farmyard manure", "Urea", "Compost"], answer: "Urea"},
  {q: "The law of demand states that when price increases ___.", options: ["Demand increases", "Demand decreases", "Supply decreases", "Demand remains constant"], answer: "Demand decreases"},
  {q: "Which of the following is a symptom of nitrogen deficiency in plants?", options: ["Purple leaves", "Stunted growth and yellowing of leaves", "Rotting of roots", "Wilting"], answer: "Stunted growth and yellowing of leaves"},
  {q: "A forest reserve is an area of land set aside for the ___.", options: ["Hunting of wild animals", "Cultivation of crops", "Preservation of timber and wildlife", "Grazing of livestock"], answer: "Preservation of timber and wildlife"},
  {q: "The first milk produced by a female animal after giving birth is called ___.", options: ["Skimmed milk", "Pasteurized milk", "Colostrum", "Condensed milk"], answer: "Colostrum"},
  {q: "Which of these is a cereal crop?", options: ["Rice", "Soybeans", "Sweet potato", "Cabbage"], answer: "Rice"},
  {q: "The interval between the time a disease pathogen enters an animal and the time the first symptom appears is the ___.", options: ["Gestation period", "Incubation period", "Lactation period", "Oestrus cycle"], answer: "Incubation period"},
  {q: "Which of the following is a physical method of weed control?", options: ["Spraying herbicides", "Hand pulling", "Crop rotation", "Using biological agents"], answer: "Hand pulling"},
  {q: "The term aquaculture refers to the ___.", options: ["Growing of crops in water", "Rearing of aquatic organisms", "Study of water soil", "Irrigation of farmland"], answer: "Rearing of aquatic organisms"},
  {q: "In the carbon cycle, plants remove carbon dioxide from the atmosphere through ___.", options: ["Respiration", "Combustion", "Decomposition", "Photosynthesis"], answer: "Photosynthesis"},
  {q: "A farm record that shows the financial position of a farm at a specific time is the ___.", options: ["Production record", "Balance sheet", "Labor record", "Farm diary"], answer: "Balance sheet"},
  {q: "The gizzard in poultry is responsible for ___.", options: ["Storing food", "Digesting fats", "Grinding food", "Absorbing water"], answer: "Grinding food"},
  {q: "Which of these is a plantation crop?", options: ["Maize", "Rubber", "Tomato", "Onion"], answer: "Rubber"},
  {q: "The loss of soil nutrients through the action of water moving vertically through the soil is ___.", options: ["Erosion", "Leaching", "Evaporation", "Capillarity"], answer: "Leaching"},
  {q: "The use of ladybirds to control aphids on a farm is an example of ___.", options: ["Chemical control", "Cultural control", "Biological control", "Physical control"], answer: "Biological control"},
  {q: "The term weaning refers to the process of ___.", options: ["Mating animals", "Removing young animals from their mothers milk", "Giving birth", "Vaccinating animals"], answer: "Removing young animals from their mothers milk"},
  {q: "A farmer who specializes in the production of vegetables is a/an ___.", options: ["Floriculturist", "Olericulturist", "Pomologist", "Silviculturist"], answer: "Olericulturist"},
  {q: "Which of the following is a micro nutrient for plants?", options: ["Nitrogen", "Zinc", "Phosphorus", "Potassium"], answer: "Zinc"},
  {q: "The function of the radiator in a tractor is to ___.", options: ["Lubricate the engine", "Cool the engine", "Supply fuel", "Generate electricity"], answer: "Cool the engine"},
  {q: "Which of these agricultural extension methods reaches the largest number of people at once?", options: ["Farm visit", "Method demonstration", "Radio broadcast", "Office call"], answer: "Radio broadcast"},
  {q: "A soil with a pH of 4.5 is considered ___.", options: ["Highly alkaline", "Neutral", "Highly acidic", "Slightly acidic"], answer: "Highly acidic"},
  {q: "The major disadvantage of communal land tenure is ___.", options: ["Land is easily available", "Land cannot be used as collateral for loans", "It promotes large scale farming", "Land fertility is always high"], answer: "Land cannot be used as collateral for loans"},
  {q: "Which of the following is a parasite of cattle?", options: ["Aphid", "Liver fluke", "Weaver bird", "Mealybug"], answer: "Liver fluke"},
  {q: "The practice of placing fertilizer beside the crop in the soil is known as ___.", options: ["Broadcasting", "Side dressing", "Foliar application", "Ring application"], answer: "Side dressing"}
];

// 2. STATE VARIABLES
let currentQ = 0;
let userAnswers = {};
let flaggedQs = {};
let timeLeft = 90 * 60; // 90 minutes in seconds
let timerInterval;

// 3. INITIALIZATION
document.getElementById('qTotal').innerText = questions.length;
loadQuestion();
startTimer();

// 4. CORE FUNCTIONS
function loadQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('questionText').innerText = q.q;

  // Load options
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.className = 'option-btn p-4 border-2 rounded-xl text-left font-medium transition-all';
    
    // Check if this option was already selected
    if(userAnswers[currentQ] === opt) {
        btn.classList.add('selected', 'border-blue-600');
    } else {
        btn.classList.add('border-gray-200');
    }
    
    btn.onclick = () => selectAnswer(opt);
    optionsDiv.appendChild(btn);
  });

  // Toggle Visibility of Nav Buttons
  document.getElementById('prevBtn').disabled = currentQ === 0;
  
  if (currentQ === questions.length - 1) {
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('submitBtn').classList.add('hidden');
  }

  updateQuestionGrid();
}

function selectAnswer(opt) {
  userAnswers[currentQ] = opt;
  loadQuestion(); 
}

function nextQuestion() {
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function jumpToQuestion(index) {
  currentQ = index;
  loadQuestion();
}

function flagQuestion() {
  flaggedQs[currentQ] = !flaggedQs[currentQ];
  updateQuestionGrid();
}

function updateQuestionGrid() {
  const grid = document.getElementById('question-grid');
  grid.innerHTML = '';
  
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    
    // Apply status colors
    if (i === currentQ) btn.classList.add('current');
    if (userAnswers[i]) btn.classList.add('attempted');
    if (flaggedQs[i]) btn.classList.add('flagged');
    
    grid.appendChild(btn);
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let hours = Math.floor(timeLeft / 3600);
    let mins = Math.floor((timeLeft % 3600) / 60);
    let secs = timeLeft % 60;
    
    let displayTime = hours > 0 
        ? `${hours}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
        : `${mins}:${secs.toString().padStart(2,'0')}`;
        
    document.getElementById('timer').innerText = `Time: ${displayTime}`;
    
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      submitTest();
    }
  }, 1000);
}

function confirmSubmit() {
    if(confirm("Are you sure you want to submit your test?")) {
        submitTest();
    }
}

function submitTest() {
  clearInterval(timerInterval);
  
  let score = 0;
  questions.forEach((q, i) => {
    if(userAnswers[i] === q.answer) {
        score++;
    }
  });
  
  let percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('question-area').classList.add('hidden');
  document.getElementById('question-grid').parentElement.classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('percent').innerText = percent;
}
</script>
</body>
</html>
