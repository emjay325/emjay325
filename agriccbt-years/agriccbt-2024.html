<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agric CBT 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .option-btn:hover { background-color: #dbeafe; }
   .option-btn.selected { background-color: #2563eb; color: white; }
   .flagged { background-color: #fbbf24 !important; color: black !important; }
   .attempted { background-color: #10b981 !important; color: white !important; }
   .current { border: 3px solid #2563eb !important; }
   #question-grid button { 
     width: 35px; height: 35px; 
     background: #e5e7eb; 
     border-radius: 6px; 
     font-weight: bold;
     font-size: 12px;
     transition: all 0.2s;
   }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div id="cbt-container" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-2xl font-bold">Sample WAEC-style CBT</h1>
      <div id="timer" class="text-xl font-bold text-red-600">Time: 90:00</div>
    </div>

    <!-- Question Grid + Review Button -->
    <div class="bg-gray-50 p-4 rounded-xl mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-bold text-gray-700">Question Navigation</span>
        <button onclick="flagQuestion()" class="px-4 py-1 bg-yellow-400 hover:bg-yellow-500 rounded-lg font-semibold text-sm flex items-center gap-1">
          Review Later 🔍
        </button>
      </div>
      <div id="question-grid" class="grid grid-cols-10 gap-2">
        <!-- JS will populate buttons here -->
      </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="question-area">
      <div class="flex justify-between items-center mb-2">
        <p class="text-sm text-gray-600">Question <span id="qNum">1</span> of <span id="qTotal">10</span></p>
      </div>
      <h2 id="questionText" class="text-xl font-semibold mb-6 min-h-[60px]"></h2>
      
      <div id="options" class="grid gap-3 mb-8"></div>

      <div class="flex justify-between border-t pt-6">
        <button onclick="prevQuestion()" id="prevBtn"
          class="px-6 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold disabled:opacity-50">
          Previous
        </button>
        
        <button onclick="nextQuestion()" id="nextBtn"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Next
        </button>

        <button onclick="confirmSubmit()" id="submitBtn"
          class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold hidden">
          Submit Test
        </button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden text-center py-10">
      <h2 class="text-3xl font-bold mb-4">Test Submitted Successfully 🎉</h2>
      <div class="bg-blue-50 p-6 rounded-2xl inline-block mb-6">
        <p class="text-xl mb-2">Your Score: <span id="score" class="font-bold text-blue-600"></span> / <span id="total"></span></p>
        <p class="text-lg">Percentage: <span id="percent" class="font-bold text-blue-600"></span>%</p>
      </div>
      <br>
      <button onclick="location.reload()" class="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold">Restart Practice</button>
    </div>
    
  </div>

<script>
// 1. DATA ARRAY
const questions = [
  {q: "The study of the relationship between farm animals and their environment is ___.", options: ["Ecology", "Autecology", "Synecology", "Agricultural ecology"], answer: "Agricultural ecology"},
  {q: "Which of the following land tenure systems encourages the long-term investment on land?", options: ["Leasehold", "Communal", "Sharecropping", "Freehold"], answer: "Freehold"},
  {q: "The atmospheric gas used directly by leguminous plants to improve soil fertility is ___.", options: ["Oxygen", "Carbon dioxide", "Nitrogen", "Argon"], answer: "Nitrogen"},
  {q: "Which of the following is a symptom of phosphorus deficiency in crops?", options: ["Yellowing of older leaves", "Purple tint on leaves", "Stunted root growth", "Curled leaf margins"], answer: "Purple tint on leaves"},
  {q: "A soil with a high proportion of large particles and low water retention is ___.", options: ["Clayey", "Silty", "Sandy", "Loamy"], answer: "Sandy"},
  {q: "The botanical name for the cultivated rubber tree is ___.", options: ["Hevea brasiliensis", "Elaeis guineensis", "Theobroma cacao", "Oryza sativa"], answer: "Hevea brasiliensis"},
  {q: "Which of the following farm machines is used for primary tillage operations?", options: ["Harrow", "Planter", "Mouldboard plough", "Ridger"], answer: "Mouldboard plough"},
  {q: "The process of removing excess water from the soil surface or sub-surface is ___.", options: ["Irrigation", "Drainage", "Evaporation", "Percolation"], answer: "Drainage"},
  {q: "The breeding system that involves mating unrelated animals of the same breed is ___.", options: ["Inbreeding", "Outcrossing", "Crossbreeding", "Linebreeding"], answer: "Outcrossing"},
  {q: "Which of the following is a respiratory organ of a fish?", options: ["Lungs", "Gills", "Trachea", "Skin"], answer: "Gills"},
  {q: "The part of the digestive tract of poultry where grinding of food occurs is the ___.", options: ["Crop", "Proventriculus", "Gizzard", "Cloaca"], answer: "Gizzard"},
  {q: "Which of the following is an example of a pasture legume?", options: ["Centrosema pubescens", "Panicum maximum", "Pennisetum purpureum", "Cynodon dactylon"], answer: "Centrosema pubescens"},
  {q: "The method of harvesting timber where only mature trees are cut is ___.", options: ["Clear cutting", "Selective cutting", "Deforestation", "Afforestation"], answer: "Selective cutting"},
  {q: "A farm tool designed specifically for digging holes during transplanting is the ___.", options: ["Hand fork", "Spade", "Hand trowel", "Pickaxe"], answer: "Hand trowel"},
  {q: "The vector responsible for transmitting the Swine Fever virus is ___.", options: ["Tsetse fly", "Tick", "Louse", "Contact with infected animal"], answer: "Contact with infected animal"},
  {q: "Which of the following is a concentrate feed for livestock?", options: ["Silage", "Hay", "Maize bran", "Fresh grass"], answer: "Maize bran"},
  {q: "The science that deals with the study of insects is ___.", options: ["Pathology", "Entomology", "Zoology", "Agronomy"], answer: "Entomology"},
  {q: "Which of the following crops requires a nursery stage before transplanting?", options: ["Maize", "Cowpea", "Tomato", "Groundnut"], answer: "Tomato"},
  {q: "The term 'prolificacy' in animal science refers to the ___.", options: ["Ability to produce many offspring", "Fast growth rate", "Resistance to diseases", "Quality of meat"], answer: "Ability to produce many offspring"},
  {q: "A major disadvantage of using animal power on the farm is that animals ___.", options: ["Are expensive to maintain", "Can work in all weather", "Cannot work for long hours", "Improve soil fertility"], answer: "Cannot work for long hours"},
  {q: "The temperature required for the incubation of chicken eggs is approximately ___.", options: ["25 degrees Celsius", "37 degrees Celsius", "45 degrees Celsius", "100 degrees Celsius"], answer: "37 degrees Celsius"},
  {q: "Which of the following is a viral disease of cattle?", options: ["Anthrax", "Brucellosis", "Rinderpest", "Tuberculosis"], answer: "Rinderpest"},
  {q: "The process of covering the soil surface with organic materials to conserve moisture is ___.", options: ["Mulching", "Cover cropping", "Terracing", "Shading"], answer: "Mulching"},
  {q: "Which of the following is a micro-nutrient?", options: ["Calcium", "Magnesium", "Zinc", "Potassium"], answer: "Zinc"},
  {q: "The function of the seed coat is to ___.", options: ["Provide food for the embryo", "Protect the internal parts of the seed", "Store water for germination", "Help in seed dispersal"], answer: "Protect the internal parts of the seed"},
  {q: "Which of the following is an example of a fungal disease in crops?", options: ["Maize streak", "Cassava mosaic", "Rice blast", "Citrus tristeza"], answer: "Rice blast"},
  {q: "The practice of keeping bees for the production of honey is ___.", options: ["Aquaculture", "Apiculture", "Floriculture", "Sericulture"], answer: "Apiculture"},
  {q: "A farm record that lists all assets and liabilities of a farm is the ___.", options: ["Production record", "Inventory record", "Labour record", "Cash book"], answer: "Inventory record"},
  {q: "The removal of the tail of an animal, usually in sheep, is known as ___.", options: ["Dehorning", "Docking", "Castration", "Branding"], answer: "Docking"},
  {q: "Which of the following is a method of controlling soil erosion on steep slopes?", options: ["Monoculture", "Terracing", "Bush burning", "Overgrazing"], answer: "Terracing"},
  {q: "The most effective method of controlling internal parasites in livestock is ___.", options: ["Dipping", "Spraying", "Drenching", "Dusting"], answer: "Drenching"},
  {q: "Which of the following is an advantage of farm mechanization?", options: ["Displacement of labor", "Increased productivity", "High capital cost", "Environmental pollution"], answer: "Increased productivity"},
  {q: "The botanical name for the Oil Palm is ___.", options: ["Elaeis guineensis", "Cocos nucifera", "Theobroma cacao", "Anacardium occidentale"], answer: "Elaeis guineensis"},
  {q: "A survey instrument used for measuring horizontal angles is the ___.", options: ["Measuring tape", "Theodolite", "Prismatic compass", "Gunter chain"], answer: "Theodolite"},
  {q: "Which of the following is a primary consumer in a farm ecosystem?", options: ["Green plants", "Grasshopper", "Lizard", "Hawk"], answer: "Grasshopper"},
  {q: "The hormone responsible for milk let-down in dairy cows is ___.", options: ["Oestrogen", "Progesterone", "Oxytocin", "Adrenaline"], answer: "Oxytocin"},
  {q: "Which of the following crops is a source of fiber?", options: ["Cotton", "Maize", "Yam", "Tomato"], answer: "Cotton"},
  {q: "The system of farming where the farmer produces only enough for his family is ___.", options: ["Commercial farming", "Subsistence farming", "Mixed farming", "Plantation farming"], answer: "Subsistence farming"},
  {q: "Which of the following is an example of an endoparasite?", options: ["Tick", "Louse", "Tapeworm", "Flea"], answer: "Tapeworm"},
  {q: "The process of treating milk with heat to kill harmful bacteria is ___.", options: ["Homogenization", "Pasteurization", "Coagulation", "Evaporation"], answer: "Pasteurization"},
  {q: "Which soil horizon is known as the topsoil?", options: ["Horizon A", "Horizon B", "Horizon C", "Horizon D"], answer: "Horizon A"},
  {q: "The agricultural extension principle that emphasizes seeing before believing is ___.", options: ["Mass method", "Individual method", "Result demonstration", "Method demonstration"], answer: "Result demonstration"},
  {q: "Which of the following is a root tuber?", options: ["Yam", "Onion", "Sweet potato", "Ginger"], answer: "Sweet potato"},
  {q: "The function of the spark plug in a tractor engine is to ___.", options: ["Inject fuel", "Ignite the fuel-air mixture", "Cool the engine", "Exhaust gases"], answer: "Ignite the fuel-air mixture"},
  {q: "Which of the following is a nitrogenous fertilizer?", options: ["Single Super Phosphate", "Muriate of Potash", "Sulphate of Ammonia", "Bone meal"], answer: "Sulphate of Ammonia"},
  {q: "The law of diminishing returns is most applicable in the ___.", options: ["Short run", "Long run", "Market period", "Production period"], answer: "Short run"},
  {q: "Which of the following is a stored product pest?", options: ["Stem borer", "Aphid", "Weevil", "Grasshopper"], answer: "Weevil"},
  {q: "The male reproductive cell of a flowering plant is the ___.", options: ["Ovule", "Pollen grain", "Stigma", "Style"], answer: "Pollen grain"},
  {q: "Which of the following farm animals has a gestation period of approximately 114 days?", options: ["Cow", "Ewe", "Sow", "Doe"], answer: "Sow"},
  {q: "The application of science and technology in the field of agriculture is ___.", options: ["Agro-climatology", "Agro-forestry", "Agricultural engineering", "Agro-technology"], answer: "Agricultural engineering"}
];
// 2. STATE VARIABLES
let currentQ = 0;
let userAnswers = {};
let flaggedQs = {};
let timeLeft = 90 * 60; // 90 minutes in seconds
let timerInterval;

// 3. INITIALIZATION
document.getElementById('qTotal').innerText = questions.length;
loadQuestion();
startTimer();

// 4. CORE FUNCTIONS
function loadQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('questionText').innerText = q.q;

  // Load options
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.className = 'option-btn p-4 border-2 rounded-xl text-left font-medium transition-all';
    
    // Check if this option was already selected
    if(userAnswers[currentQ] === opt) {
        btn.classList.add('selected', 'border-blue-600');
    } else {
        btn.classList.add('border-gray-200');
    }
    
    btn.onclick = () => selectAnswer(opt);
    optionsDiv.appendChild(btn);
  });

  // Toggle Visibility of Nav Buttons
  document.getElementById('prevBtn').disabled = currentQ === 0;
  
  if (currentQ === questions.length - 1) {
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('submitBtn').classList.add('hidden');
  }

  updateQuestionGrid();
}

function selectAnswer(opt) {
  userAnswers[currentQ] = opt;
  loadQuestion(); 
}

function nextQuestion() {
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function jumpToQuestion(index) {
  currentQ = index;
  loadQuestion();
}

function flagQuestion() {
  flaggedQs[currentQ] = !flaggedQs[currentQ];
  updateQuestionGrid();
}

function updateQuestionGrid() {
  const grid = document.getElementById('question-grid');
  grid.innerHTML = '';
  
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    
    // Apply status colors
    if (i === currentQ) btn.classList.add('current');
    if (userAnswers[i]) btn.classList.add('attempted');
    if (flaggedQs[i]) btn.classList.add('flagged');
    
    grid.appendChild(btn);
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let hours = Math.floor(timeLeft / 3600);
    let mins = Math.floor((timeLeft % 3600) / 60);
    let secs = timeLeft % 60;
    
    let displayTime = hours > 0 
        ? `${hours}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
        : `${mins}:${secs.toString().padStart(2,'0')}`;
        
    document.getElementById('timer').innerText = `Time: ${displayTime}`;
    
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      submitTest();
    }
  }, 1000);
}

function confirmSubmit() {
    if(confirm("Are you sure you want to submit your test?")) {
        submitTest();
    }
}

function submitTest() {
  clearInterval(timerInterval);
  
  let score = 0;
  questions.forEach((q, i) => {
    if(userAnswers[i] === q.answer) {
        score++;
    }
  });
  
  let percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('question-area').classList.add('hidden');
  document.getElementById('question-grid').parentElement.classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('percent').innerText = percent;
}
</script>
</body>
</html>
