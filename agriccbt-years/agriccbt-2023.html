<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agric CBT 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .option-btn:hover { background-color: #dbeafe; }
   .option-btn.selected { background-color: #2563eb; color: white; }
   .flagged { background-color: #fbbf24 !important; color: black !important; }
   .attempted { background-color: #10b981 !important; color: white !important; }
   .current { border: 3px solid #2563eb !important; }
   #question-grid button { 
     width: 35px; height: 35px; 
     background: #e5e7eb; 
     border-radius: 6px; 
     font-weight: bold;
     font-size: 12px;
     transition: all 0.2s;
   }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div id="cbt-container" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-2xl font-bold">Sample WAEC-style CBT</h1>
      <div id="timer" class="text-xl font-bold text-red-600">Time: 90:00</div>
    </div>

    <!-- Question Grid + Review Button -->
    <div class="bg-gray-50 p-4 rounded-xl mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-bold text-gray-700">Question Navigation</span>
        <button onclick="flagQuestion()" class="px-4 py-1 bg-yellow-400 hover:bg-yellow-500 rounded-lg font-semibold text-sm flex items-center gap-1">
          Review Later 🔍
        </button>
      </div>
      <div id="question-grid" class="grid grid-cols-10 gap-2">
        <!-- JS will populate buttons here -->
      </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="question-area">
      <div class="flex justify-between items-center mb-2">
        <p class="text-sm text-gray-600">Question <span id="qNum">1</span> of <span id="qTotal">10</span></p>
      </div>
      <h2 id="questionText" class="text-xl font-semibold mb-6 min-h-[60px]"></h2>
      
      <div id="options" class="grid gap-3 mb-8"></div>

      <div class="flex justify-between border-t pt-6">
        <button onclick="prevQuestion()" id="prevBtn"
          class="px-6 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold disabled:opacity-50">
          Previous
        </button>
        
        <button onclick="nextQuestion()" id="nextBtn"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Next
        </button>

        <button onclick="confirmSubmit()" id="submitBtn"
          class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold hidden">
          Submit Test
        </button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden text-center py-10">
      <h2 class="text-3xl font-bold mb-4">Test Submitted Successfully 🎉</h2>
      <div class="bg-blue-50 p-6 rounded-2xl inline-block mb-6">
        <p class="text-xl mb-2">Your Score: <span id="score" class="font-bold text-blue-600"></span> / <span id="total"></span></p>
        <p class="text-lg">Percentage: <span id="percent" class="font-bold text-blue-600"></span>%</p>
      </div>
      <br>
      <button onclick="location.reload()" class="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold">Restart Practice</button>
    </div>
    
  </div>

<script>
// 1. DATA ARRAY
const questions = [
  {q: "Rocks formed from the cooling and solidification of molten magma are known as ___.", options: ["Sedimentary rocks", "Metamorphic rocks", "Igneous rocks", "Sandstone"], answer: "Igneous rocks"},
  {q: "The type of soil water that is available for plant root absorption is ___.", options: ["Hygroscopic water", "Gravitational water", "Capillary water", "Chemically combined water"], answer: "Capillary water"},
  {q: "Which of the following is a physical weathering agent of rocks?", options: ["Hydration", "Oxidation", "Temperature change", "Carbonation"], answer: "Temperature change"},
  {q: "The process by which soil nutrients are washed down beyond the reach of plant roots is ___.", options: ["Erosion", "Leaching", "Evaporation", "Capillarity"], answer: "Leaching"},
  {q: "Which of the following farm surveying instruments is used for measuring distances?", options: ["Theodolite", "Abney level", "Gunter's chain", "Prismatic compass"], answer: "Gunter's chain"},
  {q: "The survey instrument used for measuring vertical angles and slopes is the ___.", options: ["Ranging pole", "Abney level", "Measuring tape", "Arrow"], answer: "Abney level"},
  {q: "A farm machine designed to perform several operations like harvesting, threshing and winnowing is the ___.", options: ["Mower", "Planter", "Combine harvester", "Sheller"], answer: "Combine harvester"},
  {q: "The maintenance practice that involves checking and changing the oil in a tractor engine is ___.", options: ["Greasing", "Lubrication", "Alignment", "Painting"], answer: "Lubrication"},
  {q: "Which of the following is an advantage of using a knapsack sprayer?", options: ["It covers a very large area quickly", "It is easy to operate by one person", "It requires fuel to run", "It is used for tilling the soil"], answer: "It is easy to operate by one person"},
  {q: "The primary purpose of a 'ranging pole' in farm surveying is for ___.", options: ["Measuring depth", "Setting out straight lines", "Measuring weights", "Driving pegs into the ground"], answer: "Setting out straight lines"},
  {q: "Which of the following is a symptom of potassium deficiency in plants?", options: ["Purple leaves", "Yellowing of leaf margins", "Stunted root growth", "Formation of small seeds"], answer: "Yellowing of leaf margins"},
  {q: "The process of nitrogen fixation by bacteria occurs mostly in the ___.", options: ["Leaves", "Flowers", "Root nodules", "Stems"], answer: "Root nodules"},
  {q: "Which of the following is a fungal disease of maize?", options: ["Maize streak", "Maize smut", "Maize mosaic", "Maize mottle"], answer: "Maize smut"},
  {q: "The removal of seedlings that are too close together to allow for better growth is ___.", options: ["Supplying", "Thinning", "Pruning", "Mulching"], answer: "Thinning"},
  {q: "Which of the following is a beneficial soil organism?", options: ["Termite", "Earthworm", "Nematode", "Cricket"], answer: "Earthworm"},
  {q: "The practice of growing only one type of crop on a farm at a time is ___.", options: ["Mixed cropping", "Monoculture", "Continuous cropping", "Crop rotation"], answer: "Monoculture"},
  {q: "Which of the following is a characteristic of a well-drained soil?", options: ["High water table", "Poor aeration", "Good pore space for air and water", "Foul smell"], answer: "Good pore space for air and water"},
  {q: "The process of using chemicals to kill weeds is known as ___.", options: ["Cultural control", "Biological control", "Chemical control", "Physical control"], answer: "Chemical control"},
  {q: "Which part of the ruminant stomach is shaped like a honeycomb?", options: ["Rumen", "Reticulum", "Omasum", "Abomasum"], answer: "Reticulum"},
  {q: "The period from the conception of a farm animal to the time of birth is ___.", options: ["Oestrus cycle", "Lactation period", "Gestation period", "Incubation period"], answer: "Gestation period"},
  {q: "Which of the following is a dual-purpose breed of cattle?", options: ["White Fulani", "Muturu", "N'dama", "Red Bororo"], answer: "White Fulani"},
  {q: "The process of providing young animals with extra feed while they are still suckling is ___.", options: ["Hand feeding", "Creep feeding", "Force feeding", "Restrictive feeding"], answer: "Creep feeding"},
  {q: "Which of the following is an ectoparasite of poultry?", options: ["Tapeworm", "Roundworm", "Mite", "Liver fluke"], answer: "Mite"},
  {q: "The act of giving birth in rabbits is known as ___.", options: ["Kidding", "Kindling", "Farrowing", "Lambing"], answer: "Kindling"},
  {q: "A male bird that has been castrated is called a ___.", options: ["Boar", "Wether", "Capon", "Steer"], answer: "Capon"},
  {q: "Which of the following is a source of Vitamin A for livestock?", options: ["Bone meal", "Fish meal", "Yellow maize", "Oyster shell"], answer: "Yellow maize"},
  {q: "The disease of cattle characterized by the presence of blood in the urine is ___.", options: ["Anthrax", "Brucellosis", "Trypanosomiasis", "Red water disease"], answer: "Red water disease"},
  {q: "Which of the following is a poultry breed kept primarily for egg production?", options: ["Rhode Island Red", "White Leghorn", "Sussex", "Plymouth Rock"], answer: "White Leghorn"},
  {q: "The process of removing the horns of an animal is called ___.", options: ["Dehorning", "Docking", "Castration", "Branding"], answer: "Dehorning"},
  {q: "Which of the following is a method of fish preservation?", options: ["Smoking", "Irrigation", "Mulching", "Grafting"], answer: "Smoking"},
  {q: "The practice of growing trees and crops on the same piece of land is ___.", options: ["Silviculture", "Agro-forestry", "Mixed farming", "Taungya system"], answer: "Agro-forestry"},
  {q: "Which of the following is a forest byproduct used in making paper?", options: ["Latex", "Gum", "Cellulose", "Resin"], answer: "Cellulose"},
  {q: "The term 'Heliculture' refers to the farming of ___.", options: ["Honey bees", "Snails", "Rabbits", "Fish"], answer: "Snails"},
  {q: "In an agricultural ecosystem, green plants are classified as ___.", options: ["Primary consumers", "Decomposers", "Producers", "Secondary consumers"], answer: "Producers"},
  {q: "The law of supply states that as the price of a commodity increases, the quantity supplied ___.", options: ["Decreases", "Increases", "Remains constant", "Falls to zero"], answer: "Increases"},
  {q: "Which of the following is a fixed asset on a farm?", options: ["Fertilizer", "Seedlings", "Farm building", "Animal feed"], answer: "Farm building"},
  {q: "A document that shows the details of a farmer's income and expenditure over a period is ___.", options: ["Farm inventory", "Balance sheet", "Profit and loss account", "Farm diary"], answer: "Profit and loss account"},
  {q: "Which of the following is an example of an indirect tax?", options: ["Personal income tax", "Company tax", "Value added tax", "Capital gains tax"], answer: "Value added tax"},
  {q: "The process of getting agricultural information to farmers is ___.", options: ["Agricultural marketing", "Agricultural extension", "Agricultural insurance", "Agricultural credit"], answer: "Agricultural extension"},
  {q: "Which of the following is a micro-nutrient for plants?", options: ["Magnesium", "Calcium", "Molybdenum", "Potassium"], answer: "Molybdenum"},
  {q: "The term 'fingerlings' is used to describe young ___.", options: ["Poultry", "Fish", "Pigs", "Goats"], answer: "Fish"},
  {q: "Which of the following is a major disadvantage of the 'slash and burn' method of farming?", options: ["It is cheap", "It requires little labor", "It causes soil erosion and loss of nutrients", "It clears the land quickly"], answer: "It causes soil erosion and loss of nutrients"},
  {q: "The instrument used to determine the slope of a land in agriculture is the ___.", options: ["Barometer", "Clinometer", "Anemometer", "Thermometer"], answer: "Clinometer"},
  {q: "Which of the following is a leguminous pasture grass?", options: ["Elephant grass", "Guinea grass", "Stylo", "Bermuda grass"], answer: "Stylo"},
  {q: "The first part of the small intestine in a farm animal is the ___.", options: ["Ileum", "Duodenum", "Jeunnum", "Caecum"], answer: "Duodenum"},
  {q: "Which of the following crops is propagated by stem cuttings?", options: ["Maize", "Rice", "Cassava", "Carrot"], answer: "Cassava"},
  {q: "The term 'culling' in livestock production means ___.", options: ["Feeding the animals", "Removing unproductive animals from a flock", "Mating the animals", "Vaccinating the animals"], answer: "Removing unproductive animals from a flock"},
  {q: "An example of a farm tool used for harvesting rice manually is the ___.", options: ["Sickle", "Spade", "Axe", "Mattock"], answer: "Sickle"},
  {q: "Which of the following is a characteristic of a loamy soil?", options: ["High sand content", "Poor nutrient status", "Good balance of sand, silt and clay", "High acidity"], answer: "Good balance of sand, silt and clay"},
  {q: "The agricultural system that involves the movement of herdsmen and their livestock from one place to another is ___.", options: ["Nomadic herding", "Ranching", "Ley farming", "Mixed farming"], answer: "Nomadic herding"}
];

// 2. STATE VARIABLES
let currentQ = 0;
let userAnswers = {};
let flaggedQs = {};
let timeLeft = 90 * 60; // 90 minutes in seconds
let timerInterval;

// 3. INITIALIZATION
document.getElementById('qTotal').innerText = questions.length;
loadQuestion();
startTimer();

// 4. CORE FUNCTIONS
function loadQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('questionText').innerText = q.q;

  // Load options
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.className = 'option-btn p-4 border-2 rounded-xl text-left font-medium transition-all';
    
    // Check if this option was already selected
    if(userAnswers[currentQ] === opt) {
        btn.classList.add('selected', 'border-blue-600');
    } else {
        btn.classList.add('border-gray-200');
    }
    
    btn.onclick = () => selectAnswer(opt);
    optionsDiv.appendChild(btn);
  });

  // Toggle Visibility of Nav Buttons
  document.getElementById('prevBtn').disabled = currentQ === 0;
  
  if (currentQ === questions.length - 1) {
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('submitBtn').classList.add('hidden');
  }

  updateQuestionGrid();
}

function selectAnswer(opt) {
  userAnswers[currentQ] = opt;
  loadQuestion(); 
}

function nextQuestion() {
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function jumpToQuestion(index) {
  currentQ = index;
  loadQuestion();
}

function flagQuestion() {
  flaggedQs[currentQ] = !flaggedQs[currentQ];
  updateQuestionGrid();
}

function updateQuestionGrid() {
  const grid = document.getElementById('question-grid');
  grid.innerHTML = '';
  
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    
    // Apply status colors
    if (i === currentQ) btn.classList.add('current');
    if (userAnswers[i]) btn.classList.add('attempted');
    if (flaggedQs[i]) btn.classList.add('flagged');
    
    grid.appendChild(btn);
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let hours = Math.floor(timeLeft / 3600);
    let mins = Math.floor((timeLeft % 3600) / 60);
    let secs = timeLeft % 60;
    
    let displayTime = hours > 0 
        ? `${hours}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
        : `${mins}:${secs.toString().padStart(2,'0')}`;
        
    document.getElementById('timer').innerText = `Time: ${displayTime}`;
    
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      submitTest();
    }
  }, 1000);
}

function confirmSubmit() {
    if(confirm("Are you sure you want to submit your test?")) {
        submitTest();
    }
}

function submitTest() {
  clearInterval(timerInterval);
  
  let score = 0;
  questions.forEach((q, i) => {
    if(userAnswers[i] === q.answer) {
        score++;
    }
  });
  
  let percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('question-area').classList.add('hidden');
  document.getElementById('question-grid').parentElement.classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('percent').innerText = percent;
}
</script>
</body>
</html>
