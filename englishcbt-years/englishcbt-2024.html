<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>English CBT 2023</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .option-btn:hover { background-color: #dbeafe; }
   .option-btn.selected { background-color: #2563eb; color: white; }
   .flagged { background-color: #fbbf24 !important; color: black !important; }
   .attempted { background-color: #10b981 !important; color: white !important; }
   .current { border: 3px solid #2563eb !important; }
   #question-grid button { 
     width: 35px; height: 35px; 
     background: #e5e7eb; 
     border-radius: 6px; 
     font-weight: bold;
     font-size: 12px;
     transition: all 0.2s;
   }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div id="cbt-container" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h1 class="text-2xl font-bold">Sample WAEC-style CBT</h1>
      <div id="timer" class="text-xl font-bold text-red-600">Time: 90:00</div>
    </div>

    <!-- Question Grid + Review Button -->
    <div class="bg-gray-50 p-4 rounded-xl mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-bold text-gray-700">Question Navigation</span>
        <button onclick="flagQuestion()" class="px-4 py-1 bg-yellow-400 hover:bg-yellow-500 rounded-lg font-semibold text-sm flex items-center gap-1">
          Review Later 🔍
        </button>
      </div>
      <div id="question-grid" class="grid grid-cols-10 gap-2">
        <!-- JS will populate buttons here -->
      </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="question-area">
      <div class="flex justify-between items-center mb-2">
        <p class="text-sm text-gray-600">Question <span id="qNum">1</span> of <span id="qTotal">10</span></p>
      </div>
      <h2 id="questionText" class="text-xl font-semibold mb-6 min-h-[60px]"></h2>
      
      <div id="options" class="grid gap-3 mb-8"></div>

      <div class="flex justify-between border-t pt-6">
        <button onclick="prevQuestion()" id="prevBtn"
          class="px-6 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg font-semibold disabled:opacity-50">
          Previous
        </button>
        
        <button onclick="nextQuestion()" id="nextBtn"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
          Next
        </button>

        <button onclick="confirmSubmit()" id="submitBtn"
          class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold hidden">
          Submit Test
        </button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="result-area" class="hidden text-center py-10">
      <h2 class="text-3xl font-bold mb-4">Test Submitted Successfully 🎉</h2>
      <div class="bg-blue-50 p-6 rounded-2xl inline-block mb-6">
        <p class="text-xl mb-2">Your Score: <span id="score" class="font-bold text-blue-600"></span> / <span id="total"></span></p>
        <p class="text-lg">Percentage: <span id="percent" class="font-bold text-blue-600"></span>%</p>
      </div>
      <br>
      <button onclick="location.reload()" class="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold">Restart Practice</button>
    </div>
    
  </div>

<script>
// 1. DATA ARRAY
const questions = [
  {q: "Each of the candidates ___ expected to bring a valid ID card.", options: ["is", "are", "were", "have"], answer: "is"},
  {q: "The teacher, as well as her students, ___ working hard to finish the syllabus.", options: ["are", "is", "were", "have been"], answer: "is"},
  {q: "No sooner had the match started ___ it began to rain.", options: ["when", "then", "than", "that"], answer: "than"},
  {q: "I would rather you ___ the truth now than later.", options: ["told", "tell", "tells", "telling"], answer: "told"},
  {q: "The student was asked to provide further ___ regarding his absence.", options: ["informations", "information", "an information", "much informations"], answer: "information"},
  {q: "Neither the man nor his brothers ___ able to identify the thief.", options: ["was", "were", "has", "is"], answer: "were"},
  {q: "If I ___ in your shoes, I would apologize to the principal.", options: ["am", "was", "were", "can be"], answer: "were"},
  {q: "He didn't study hard, ___ he failed the examination.", options: ["consequently", "nevertheless", "furthermore", "however"], answer: "consequently"},
  {q: "The suitcase is ___ heavy for the little boy to carry.", options: ["so", "too", "very", "much"], answer: "too"},
  {q: "We must abide ___ the rules of the school.", options: ["with", "by", "to", "at"], answer: "by"},
  {q: "The police ___ still investigating the cause of the fire.", options: ["is", "are", "was", "has"], answer: "are"},
  {q: "The story he told us was quite ___.", options: ["incredible", "incredulous", "incredulity", "incredibly"], answer: "incredible"},
  {q: "Choose the word NEAREST IN MEANING: The principal's speech was very METICULOUS.", options: ["careful", "long", "boring", "angry"], answer: "careful"},
  {q: "Choose the word NEAREST IN MEANING: The soldier showed great FORTITUDE during the war.", options: ["fear", "courage", "weakness", "laziness"], answer: "courage"},
  {q: "Choose the word NEAREST IN MEANING: The doctor's handwriting is ILLEGIBLE.", options: ["readable", "unreadable", "beautiful", "messy"], answer: "unreadable"},
  {q: "Choose the word NEAREST IN MEANING: The decision was UNANIMOUS.", options: ["divided", "agreed by all", "secret", "uncertain"], answer: "agreed by all"},
  {q: "Choose the word NEAREST IN MEANING: The harvest this year was PLENTIFUL.", options: ["scanty", "abundant", "poor", "small"], answer: "abundant"},
  {q: "Choose the word NEAREST IN MEANING: The new law is OBSOLETE.", options: ["modern", "outdated", "effective", "strict"], answer: "outdated"},
  {q: "Choose the word NEAREST IN MEANING: He is a CAPRICIOUS person.", options: ["reliable", "unpredictable", "kind", "stubborn"], answer: "unpredictable"},
  {q: "Choose the word NEAREST IN MEANING: The student's answer was PERTINENT to the question.", options: ["relevant", "wrong", "long", "confusing"], answer: "relevant"},
  {q: "Choose the word OPPOSITE IN MEANING: The manager is very LENIENT with his staff.", options: ["kind", "strict", "patient", "soft"], answer: "strict"},
  {q: "Choose the word OPPOSITE IN MEANING: The suspect was ACQUITTED of all charges.", options: ["freed", "convicted", "released", "warned"], answer: "convicted"},
  {q: "Choose the word OPPOSITE IN MEANING: The room was very SPACIOUS.", options: ["large", "cramped", "empty", "bright"], answer: "cramped"},
  {q: "Choose the word OPPOSITE IN MEANING: She is an OPTIMISTIC person.", options: ["hopeful", "pessimistic", "cheerful", "careless"], answer: "pessimistic"},
  {q: "Choose the word OPPOSITE IN MEANING: The economy is currently STAGNANT.", options: ["still", "growing", "slow", "fixed"], answer: "growing"},
  {q: "Choose the word OPPOSITE IN MEANING: His actions were COVERT.", options: ["secret", "open", "hidden", "quiet"], answer: "open"},
  {q: "Choose the word OPPOSITE IN MEANING: The surface of the table is CONCAVE.", options: ["flat", "convex", "hollow", "smooth"], answer: "convex"},
  {q: "Choose the word OPPOSITE IN MEANING: The army had to RETREAT.", options: ["advance", "run", "hide", "stop"], answer: "advance"},
  {q: "Choose the word OPPOSITE IN MEANING: The witness was very HOSTILE.", options: ["angry", "friendly", "quiet", "rude"], answer: "friendly"},
  {q: "Choose the word OPPOSITE IN MEANING: The smell was PLEASANT.", options: ["nice", "offensive", "strong", "sweet"], answer: "offensive"},
  {q: "IDIOM: To 'hit the nail on the head' means to ___.", options: ["be a carpenter", "do something exactly right", "be violent", "make a mistake"], answer: "do something exactly right"},
  {q: "IDIOM: To 'let the cat out of the bag' means to ___.", options: ["be cruel to animals", "reveal a secret", "lose a pet", "buy something expensive"], answer: "reveal a secret"},
  {q: "IDIOM: 'Crocodile tears' means ___.", options: ["a dangerous person", "sincere sorrow", "fake crying", "animal behavior"], answer: "fake crying"},
  {q: "IDIOM: To 'be in the same boat' means to ___.", options: ["travel together", "be in the same difficult situation", "like sailing", "wear the same clothes"], answer: "be in the same difficult situation"},
  {q: "IDIOM: To 'bury the hatchet' means to ___.", options: ["hide a weapon", "make peace", "dig a hole", "forget the past"], answer: "make peace"},
  {q: "IDIOM: 'A green horn' refers to a person who is ___.", options: ["a gardener", "inexperienced", "very strong", "envious"], answer: "inexperienced"},
  {q: "SENTENCE INTERPRETATION: Tade takes after his father. This means Tade ___.", options: ["looks like his father", "runs faster than his father", "always follows his father", "hates his father"], answer: "looks like his father"},
  {q: "SENTENCE INTERPRETATION: The news of his death was a hard nut to crack. This means the news was ___.", options: ["easy to understand", "difficult to accept or handle", "about a nut", "very funny"], answer: "difficult to accept or handle"},
  {q: "SENTENCE INTERPRETATION: She is at her wits' end. This means she ___.", options: ["is very clever", "is no longer worried", "does not know what to do next", "is at the end of a road"], answer: "does not know what to do next"},
  {q: "SENTENCE INTERPRETATION: The soldiers were told to hold their ground. This means they should ___.", options: ["dig holes", "not retreat", "buy some land", "lie down"], answer: "not retreat"},
  {q: "Choose the correct spelling:", options: ["Occurred", "Ocured", "Occured", "Ocferred"], answer: "Occurred"},
  {q: "Choose the correct spelling:", options: ["Privilege", "Priviledge", "Privilidge", "Privilage"], answer: "Privilege"},
  {q: "Choose the correct spelling:", options: ["Questionnaire", "Questionaire", "Questionare", "Questionnairee"], answer: "Questionnaire"},
  {q: "Choose the correct spelling:", options: ["Diarhoea", "Diarrhoea", "Diarrhea", "Diarhea"], answer: "Diarrhoea"},
  {q: "Choose the correct spelling:", options: ["Bureaucracy", "Bureacracy", "Beureaucracy", "Buerocracy"], answer: "Bureaucracy"},
  {q: "I am not used to ___ early in the morning.", options: ["wake up", "waking up", "be waking", "waked up"], answer: "waking up"},
  {q: "None of the players ___ ready for the match.", options: ["was", "were", "are", "have been"], answer: "was"},
  {q: "The boy is a bit of a handful. This means the boy is ___.", options: ["generous", "small", "difficult to control", "helpful"], answer: "difficult to control"},
  {q: "You shouldn't look down on the poor. This means you shouldn't ___ them.", options: ["watch", "help", "despise", "pity"], answer: "despise"},
  {q: "He had to withdraw ___ the race due to injury.", options: ["at", "from", "in", "off"], answer: "from"}
];


// 2. STATE VARIABLES
let currentQ = 0;
let userAnswers = {};
let flaggedQs = {};
let timeLeft = 90 * 60; // 90 minutes in seconds
let timerInterval;

// 3. INITIALIZATION
document.getElementById('qTotal').innerText = questions.length;
loadQuestion();
startTimer();

// 4. CORE FUNCTIONS
function loadQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('questionText').innerText = q.q;

  // Load options
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.className = 'option-btn p-4 border-2 rounded-xl text-left font-medium transition-all';
    
    // Check if this option was already selected
    if(userAnswers[currentQ] === opt) {
        btn.classList.add('selected', 'border-blue-600');
    } else {
        btn.classList.add('border-gray-200');
    }
    
    btn.onclick = () => selectAnswer(opt);
    optionsDiv.appendChild(btn);
  });

  // Toggle Visibility of Nav Buttons
  document.getElementById('prevBtn').disabled = currentQ === 0;
  
  if (currentQ === questions.length - 1) {
    document.getElementById('nextBtn').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
  } else {
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('submitBtn').classList.add('hidden');
  }

  updateQuestionGrid();
}

function selectAnswer(opt) {
  userAnswers[currentQ] = opt;
  loadQuestion(); 
}

function nextQuestion() {
  if(currentQ < questions.length - 1) {
    currentQ++;
    loadQuestion();
  }
}

function prevQuestion() {
  if(currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function jumpToQuestion(index) {
  currentQ = index;
  loadQuestion();
}

function flagQuestion() {
  flaggedQs[currentQ] = !flaggedQs[currentQ];
  updateQuestionGrid();
}

function updateQuestionGrid() {
  const grid = document.getElementById('question-grid');
  grid.innerHTML = '';
  
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.innerText = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    
    // Apply status colors
    if (i === currentQ) btn.classList.add('current');
    if (userAnswers[i]) btn.classList.add('attempted');
    if (flaggedQs[i]) btn.classList.add('flagged');
    
    grid.appendChild(btn);
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    let hours = Math.floor(timeLeft / 3600);
    let mins = Math.floor((timeLeft % 3600) / 60);
    let secs = timeLeft % 60;
    
    let displayTime = hours > 0 
        ? `${hours}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
        : `${mins}:${secs.toString().padStart(2,'0')}`;
        
    document.getElementById('timer').innerText = `Time: ${displayTime}`;
    
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      submitTest();
    }
  }, 1000);
}

function confirmSubmit() {
    if(confirm("Are you sure you want to submit your test?")) {
        submitTest();
    }
}

function submitTest() {
  clearInterval(timerInterval);
  
  let score = 0;
  questions.forEach((q, i) => {
    if(userAnswers[i] === q.answer) {
        score++;
    }
  });
  
  let percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('question-area').classList.add('hidden');
  document.getElementById('question-grid').parentElement.classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('percent').innerText = percent;
}
</script>
</body>
</html>
